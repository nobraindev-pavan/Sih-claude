# Fly.io config for the full interactive app.
# Deploy with:  fly launch --no-deploy   then   fly deploy
#
# 1 GB of memory is deliberate: OR-Tools plus the scientific stack plus a
# handful of cached solved scenarios will not fit in 256 MB. `min_machines
# running = 1` costs a little but avoids a cold start in front of judges.

app = "sanchay"
primary_region = "bom"          # Mumbai — nearest to the intended users

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  WEB_CONCURRENCY = "1"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    # A solve pins a core. Queue rather than thrash.
    soft_limit = 4
    hard_limit = 8

[[http_service.checks]]
  grace_period = "20s"
  interval = "30s"
  method = "GET"
  path = "/api/health"
  timeout = "5s"

[[vm]]
  size = "shared-cpu-2x"
  memory = "1gb"
